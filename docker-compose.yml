services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbernex
      POSTGRES_USER: barbernex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente}
    volumes:
      - barbernex_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  barbernex_db:
