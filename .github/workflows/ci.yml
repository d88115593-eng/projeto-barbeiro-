name: Revisão BARBERNEX
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar esquema do banco
        run: npx prisma validate
      - name: Gerar cliente e banco de testes
        run: npx prisma generate && npx prisma db push
      - name: Testar cálculo de sinal
        run: node --experimental-strip-types --test scripts/test-deposit.mjs
      - name: Testar banco, agenda e isolamento
        run: node scripts/smoke-test.mjs
      - name: Verificar tipos
        run: npm run typecheck
      - name: Compilar aplicação
        run: npm run build
